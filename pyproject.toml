[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "entitylinkage"
version = "0.1.0"
description = "Conservative, explainable entity linkage for external records"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
entitylinkage = "entitylinkage.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/entitylinkage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
